# Supabase CLI configuration for local development (`npx supabase start`).
# Hosted projects are configured in the dashboard; see docs/SETUP.md.
project_id = "campus-table"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Match your hosted project's Postgres version when linking.
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "2MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "http://127.0.0.1:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
# Must stay enabled: students order as anonymous users (no personal data).
enable_signup = true
enable_anonymous_sign_ins = true

[auth.rate_limit]
# Anonymous sign-ins per hour per IP. Campus Wi-Fi often puts many students
# behind one public IP, so this is higher than the default of 30.
anonymous_users = 300

[auth.email]
# No public email sign-up: staff accounts are created by an administrator.
enable_signup = false
double_confirm_changes = true
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "per_worker"

# The functions verify the caller themselves (auth.getUser), which works with
# both legacy and asymmetric JWT signing keys. The webhook is authenticated by
# Razorpay's HMAC signature instead of a JWT.
[functions.create-payment-order]
verify_jwt = false

[functions.verify-payment]
verify_jwt = false

[functions.razorpay-webhook]
verify_jwt = false

[functions.update-order-status]
verify_jwt = false
